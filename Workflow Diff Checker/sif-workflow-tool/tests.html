<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workflow comparison regression tests</title>
<style>
body { font: 15px system-ui; margin: 24px; background: #101728; color: #eee; }
.pass { color: #77e6aa; } .fail { color: #ff9696; }
iframe { width: 100%; height: 350px; border: 1px solid #777; }
</style>
</head>
<body>
<h1>Workflow comparison regression tests</h1>
<p id="summary">Running…</p>
<ol id="results"></ol>
<iframe id="app" title="Application under test" src="index.html"></iframe>
<script>
const results = document.getElementById("results");
let passed = 0, failed = 0;
function test(name, fn) {
  const li = document.createElement("li");
  try { fn(); passed++; li.className = "pass"; li.textContent = "PASS: " + name; }
  catch (error) { failed++; li.className = "fail"; li.textContent = "FAIL: " + name + " — " + error.message; }
  results.appendChild(li);
}
function assert(condition, message) { if (!condition) throw new Error(message); }
async function load(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error(path + ": HTTP " + response.status);
  return response.text();
}
document.getElementById("app").addEventListener("load", async () => {
  try {
    const w = document.getElementById("app").contentWindow;
    const names = ["identical", "functional", "added-removed", "audit-layout", "duplicate-names", "broken-reference", "conflicting-endpoint", "invalid-xml"];
    const baseline = await load("fixtures/sample.sif");
    const files = {};
    for (const name of names) files[name] = await load("fixtures/variations/" + name + ".sif");
    const base = w.parseSif(baseline).workflows[0];
    const parse = name => w.parseSif(files[name]).workflows[0];
    const diff = (name, options) => w.diffWorkflows(base, parse(name), options || {});
    test("sample has five steps, five branches, seven properties", () => {
      assert(base.steps.length === 5 && base.branches.length === 5 && base.props.length === 7, "incorrect sample counts");
    });
    await w.loadSingleFile(new w.File([baseline], "baseline.sif"));
    test("sidebar and drawer splitters resize and single drawer fills space", () => {
      const frame = document.getElementById("app");
      frame.style.height = "900px";
      const doc = w.document, aside = doc.querySelector("aside");
      const width = aside.getBoundingClientRect().width;
      doc.getElementById("sidebarSplitter").dispatchEvent(new w.KeyboardEvent("keydown", {key:"ArrowLeft", bubbles:true}));
      assert(aside.getBoundingClientRect().width > width, "sidebar did not widen");
      const meta = doc.getElementById("paneMeta"), details = doc.getElementById("paneDetails");
      const before = meta.getBoundingClientRect().height;
      meta.querySelector(".drawer-splitter").dispatchEvent(new w.KeyboardEvent("keydown", {key:"ArrowDown", bubbles:true}));
      assert(meta.getBoundingClientRect().height > before, "drawer did not expand");
      for (const pane of doc.querySelectorAll("aside .pane")) pane.open = pane === details;
      assert(details.open && details.getBoundingClientRect().height > aside.clientHeight * 0.5, "single drawer did not fill sidebar");
      assert(details.getBoundingClientRect().width >= aside.clientWidth - 20, "drawer did not fill sidebar width");
      for (const id of ["paneMeta", "paneDetails", "paneSupport", "paneProperties"]) doc.getElementById(id).open = true;
      frame.style.height = "350px";
    });
    test("pointer drag handlers resize sidebar and adjacent drawers", () => {
      const frame = document.getElementById("app");
      const doc = w.document, aside = doc.querySelector("aside");
      const widthHandle = doc.getElementById("sidebarSplitter");
      const meta = doc.getElementById("paneMeta");
      const heightHandle = meta.querySelector(".drawer-splitter");
      const originalHeight = frame.style.height;
      frame.style.height = "900px";
      function drag(handle, startX, startY, endX, endY) {
        const oldSet = handle.setPointerCapture, oldHas = handle.hasPointerCapture;
        let captured = false;
        handle.setPointerCapture = () => { captured = true; };
        handle.hasPointerCapture = () => captured;
        try {
          handle.dispatchEvent(new w.PointerEvent("pointerdown", {bubbles:true, button:0, pointerId:1, clientX:startX, clientY:startY}));
          handle.dispatchEvent(new w.PointerEvent("pointermove", {bubbles:true, pointerId:1, clientX:endX, clientY:endY}));
          assert(captured, "pointer was not captured");
        } finally {
          handle.setPointerCapture = oldSet;
          handle.hasPointerCapture = oldHas;
        }
      }
      try {
        const width = aside.getBoundingClientRect().width;
        const rect = widthHandle.getBoundingClientRect();
        drag(widthHandle, rect.left, rect.top, rect.left - 40, rect.top);
        assert(aside.getBoundingClientRect().width > width + 20, "pointer drag did not widen sidebar");
        const height = meta.getBoundingClientRect().height;
        const handleRect = heightHandle.getBoundingClientRect();
        drag(heightHandle, handleRect.left, handleRect.top, handleRect.left, handleRect.top + 30);
        assert(meta.getBoundingClientRect().height > height + 10, "pointer drag did not increase drawer height");
      } finally {
        frame.style.height = originalHeight;
      }
    });
    test("each open drawer has an independent scrollable content area", () => {
      const frame = document.getElementById("app"), doc = w.document;
      const originalHeight = frame.style.height;
      const panes = Array.from(doc.querySelectorAll("aside .pane"));
      const openStates = panes.map(pane => pane.open);
      frame.style.height = "900px";
      try {
        for (const pane of panes) pane.open = true;
        for (const pane of panes) {
          const content = pane.querySelector(".drawer-content");
          const extra = doc.createElement("div");
          extra.style.cssText = "height:600px;min-height:600px";
          content.appendChild(extra);
          try {
            assert(w.getComputedStyle(content).overflowY === "scroll", pane.id + " has no scrollbar");
            assert(content.clientHeight > 0 && content.scrollHeight > content.clientHeight, pane.id + " content is not bounded");
            content.scrollTop = content.scrollHeight;
            assert(content.scrollTop > 0, pane.id + " did not scroll");
          } finally {
            content.scrollTop = 0;
            extra.remove();
          }
        }
      } finally {
        panes.forEach((pane, index) => pane.open = openStates[index]);
        frame.style.height = originalHeight;
      }
    });
    test("workflow properties show attributes", () => {
      const text = w.document.getElementById("propertiesContent").textContent;
      assert(text.includes("Test Property 1") && text.includes("DATA_TYPE") && text.includes("VARCHAR"), "property attributes missing");
    });
    test("selecting a node opens the selection drawer", () => {
      const pane = w.document.getElementById("paneDetails");
      pane.open = false;
      const node = w.document.querySelector(".node");
      node.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
      assert(pane.open && w.document.getElementById("detailsContent").textContent.includes("Step"), "selection drawer did not open");
    });
    test("node search finds property references in arguments and criteria", () => {
      const input = w.document.getElementById("searchSingle");
      input.value = "Test Property 2";
      input.dispatchEvent(new w.Event("input", {bubbles:true}));
      const matches = Array.from(w.document.querySelectorAll("#searchResults .search-match"));
      assert(w.document.getElementById("paneSearch").open, "matches drawer not opened");
      assert(matches.some(m => m.textContent.includes("I/O argument") && m.textContent.includes("PROPERTY_NAME")), "argument reference missing");
      assert(matches.some(m => m.textContent.includes("Criteria") && m.textContent.includes("PROPERTY_NAME")), "criterion reference missing");
      const wf = w.getCurrentWorkflow();
      const first = wf.steps.find(s => s.attrs.NAME === "Set Test Properties");
      const second = wf.steps.find(s => s.attrs.NAME === "Set Test Property 2 to N");
      const branch = wf.branches.find(b => b.parentStepName === "Is Test?" && b.attrs.NAME === "N");
      assert([first, second].every(s => w.document.querySelector(`.node.search-hit[data-id="${s.id}"]`)), "not all matching nodes highlighted");
      const edge = w.document.querySelector(`.edge[data-id="${branch.id}"]`);
      assert(edge && edge.previousElementSibling.classList.contains("search-halo"), "matching branch not highlighted");
      w.renderCurrent(false);
      assert(w.document.querySelectorAll(".node.search-hit").length >= 2 && w.document.querySelector(".search-halo"), "highlights lost on rerender");
      const argumentMatch = Array.from(w.document.querySelectorAll("#searchResults .search-match")).find(m => m.textContent.includes("I/O argument"));
      argumentMatch.click();
      assert(w.document.querySelector(".node.selected") && w.document.getElementById("detailsContent").textContent.includes("Set Test Properties"), "match did not select its node");
      input.value = "no-such-reference-xyz";
      input.dispatchEvent(new w.Event("input", {bubbles:true}));
      assert(w.document.querySelectorAll("#searchResults .search-match").length === 0, "stale matches remained");
      assert(!w.document.querySelector(".search-hit, .search-halo, .search-hit-badge"), "stale graph highlights remained");
      assert(w.document.getElementById("searchResults").textContent.includes("0"), "zero count missing");
      input.value = "";
      input.dispatchEvent(new w.Event("input", {bubbles:true}));
    });
    test("X-ray shows existing query, operation and business fields without inventing values", () => {
      const fields = w.xrayFields({
        attrs: { SEARCH_SPECIFICATION: "[Id]='1'", OPERATION_TYPE: "Query", BUSINESS_COMPONENT: "Account", BUSINESS_SERVICE_NAME: "Service", BUSINESS_SERVICE_METHOD: "Run" },
        ioArgs: [{attrs: {NAME:"Input", TYPE:"Literal", VALUE:"abc"}}]
      });
      assert(fields[0].includes("SEARCH_SPECIFICATION"), "search specification not prioritized");
      for (const value of ["OPERATION_TYPE: Query", "BUSINESS_COMPONENT: Account", "BUSINESS_SERVICE_NAME: Service", "BUSINESS_SERVICE_METHOD: Run", "TYPE: Literal", "VALUE: abc"]) {
        assert(fields.some(field => field.includes(value)), "missing " + value);
      }
      assert(w.xrayFields({attrs:{TYPE:"TASK"}, ioArgs:[]}).length === 0, "invented fields");
    });
    test("X-ray toggle displays workflow fields and switches off", () => {
      const doc = w.document, toggle = doc.getElementById("btnXray");
      toggle.click();
      assert(toggle.getAttribute("aria-pressed") === "true", "X-ray did not turn on");
      assert(Array.from(doc.querySelectorAll(".xray-label title")).some(t => t.textContent.includes("BUSINESS_SERVICE_NAME: Workflow Utilities")), "service not shown");
      toggle.click();
      assert(toggle.getAttribute("aria-pressed") === "false" && !doc.querySelector(".xray-label"), "X-ray did not turn off");
    });
    test("decision diamond toggle preserves selection and connections", () => {
      const doc = w.document;
      const toggle = doc.getElementById("btnDiamonds");
      const decision = doc.querySelector(".node.decision");
      decision.dispatchEvent(new w.MouseEvent("click", {bubbles:true}));
      const edgeCount = doc.querySelectorAll(".edge").length;
      toggle.click();
      assert(toggle.getAttribute("aria-pressed") === "true", "toggle state not set");
      assert(doc.querySelector(".node.decision.selected polygon"), "selected decision is not a diamond");
      assert(doc.querySelectorAll(".edge").length === edgeCount, "connections changed");
      toggle.click();
      assert(toggle.getAttribute("aria-pressed") === "false" && doc.querySelector(".node.decision.selected rect"), "rectangular display not restored");
    });
    test("branch expression tooltip is verbatim and preview selects its branch", () => {
      const expressions = Array.from(w.document.querySelectorAll(".edge-expression"));
      const branch = base.branches.find(b => b.attrs.NAME === "N");
      assert(expressions.length === 1, "expected one condition preview");
      assert(expressions[0].querySelector("title").textContent === `Expression: ${branch.attrs.EXPRESSION}`, "full expression differs from XML");
      assert(expressions[0].firstChild.nodeValue.startsWith("Expression: "), "expression preview missing");
      expressions[0].dispatchEvent(new w.MouseEvent("click", {bubbles:true}));
      const details = w.document.getElementById("detailsContent").textContent;
      assert(details.includes(branch.attrs.EXPRESSION), "branch selection failed");
      assert(details.includes("Test Property 2") && details.includes("LO_CHAR1"), "criterion details missing");
    });
    test("long branch labels avoid nodes and other branch labels in both layouts", () => {
      const frame = document.getElementById("app"), doc = w.document;
      const oldWidth = frame.style.width, toggle = doc.getElementById("btnXray");
      const wf = w.parseSif(baseline).workflows[0];
      for (const branch of wf.branches) branch.attrs.EXPRESSION = "Long condition " + "WIDE_FIELD = 'some value' AND ".repeat(20);
      const overlaps = (a,b) => a.x < b.x+b.width && a.x+a.width > b.x && a.y < b.y+b.height && a.y+a.height > b.y;
      try {
        for (const width of ["800px", "1600px"]) {
          frame.style.width = width;
          for (const xray of [false, true]) {
            if ((toggle.getAttribute("aria-pressed") === "true") !== xray) toggle.click();
            w.renderWorkflow(wf, null);
            const nodes = Array.from(doc.querySelectorAll("#nodes .node"), n => n.getBBox());
            const labels = Array.from(doc.querySelectorAll(".edge-label, .edge-expression"));
            assert(labels.some(label => label.classList.contains("edge-expression")), "no expression previews");
            for (const label of labels) {
              assert(label.getComputedTextLength() <= 261, "preview too wide");
              assert(!nodes.some(node => overlaps(label.getBBox(), node)), "label overlaps node at " + width + " xray=" + xray);
              if (label.classList.contains("edge-expression")) {
                assert(label.querySelector("title").textContent === "Expression: " + wf.branches.find(b => b.id === label.dataset.id).attrs.EXPRESSION, "full expression lost");
              }
            }
            for (let i = 0; i < labels.length; i++) for (let j = i+1; j < labels.length; j++) {
              if (labels[i].dataset.id !== labels[j].dataset.id)
                assert(!overlaps(labels[i].getBBox(), labels[j].getBBox()), "branch labels overlap");
            }
          }
        }
      } finally {
        frame.style.width = oldWidth;
        if (toggle.getAttribute("aria-pressed") === "true") toggle.click();
        w.renderCurrent(false);
      }
    });
    test("criteria-only branch still displays its criteria", () => {
      const wf = w.parseSif(baseline).workflows[0];
      delete wf.branches.find(b => b.attrs.NAME === "N").attrs.EXPRESSION;
      w.renderWorkflow(wf, null);
      const conditions = Array.from(w.document.querySelectorAll(".edge-expression"));
      assert(conditions.length === 1 && conditions[0].firstChild.nodeValue.includes("Criteria: 1"), "criteria-only branch not displayed");
      w.renderWorkflow(w.parseSif(baseline).workflows[0], null);
    });
    test("zoom supports large diagrams and anchors the chosen point", () => {
      const viewport = w.document.getElementById("viewport");
      w.fitToScreen();
      w.setScale(100, 120, 80);
      const m = new w.DOMMatrix(w.getComputedStyle(viewport).transform);
      assert(m.a === 100, "zoom is capped below 100x");
      assert(Math.abs(m.e + 11880) < 0.01 && Math.abs(m.f + 7920) < 0.01, "anchor moved");
      w.setScale(NaN);
      assert(new w.DOMMatrix(w.getComputedStyle(viewport).transform).a === 100, "invalid scale changed view");
      w.document.getElementById("btnFit").click();
      const fitted = new w.DOMMatrix(w.getComputedStyle(viewport).transform);
      assert(fitted.a === 1 && fitted.e === 0 && fitted.f === 0, "fit did not reset viewport");
    });
    test("wheel zoom works on the fixed canvas after zooming out", () => {
      const canvas = w.document.getElementById("canvasWrap");
      w.setScale(0.02);
      canvas.dispatchEvent(new w.WheelEvent("wheel", { deltaY:-1, bubbles:true, cancelable:true, clientX:100, clientY:100 }));
      assert(new w.DOMMatrix(w.getComputedStyle(w.document.getElementById("viewport")).transform).a > 0.02, "wheel zoom failed");
      w.fitToScreen();
    });
    test("identical SIF has no changes", () => assert(diff("identical").changes.length === 0, "unexpected changes"));
    test("functional variation compares workflow, property, service, argument, expression and criterion value", () => {
      const d = diff("functional");
      const paths = d.changes.flatMap(c => c.fields.map(f => f.path));
      for (const field of ["WORKFLOW.STATUS", "PROPERTY.DATA_TYPE", "STEP.BUSINESS_SERVICE_METHOD", "VALUE_SEARCH_SPECIFICATION", "BRANCH.EXPRESSION", "LO_CHAR1"])
        assert(paths.some(p => p.includes(field)), "missing " + field);
      const arg = d.changes.flatMap(c => c.fields).find(f => f.path.includes("VALUE_SEARCH_SPECIFICATION"));
      assert(arg.old === "Y" && arg.new === "N", "incorrect argument values");
    });
    test("addition and removals are classified", () => {
      const s = diff("added-removed").summary;
      assert(s.steps.added === 1 && s.props.removed === 1 && s.branches.removed === 1, "incorrect summary");
    });
    test("audit and layout excluded by default and included separately", () => {
      assert(diff("audit-layout").changes.length === 0, "metadata counted by default");
      const audit = diff("audit-layout",{includeAudit:true}).changes.flatMap(c=>c.fields);
      const layout = diff("audit-layout",{includeLayout:true}).changes.flatMap(c=>c.fields);
      assert(audit.some(f=>f.path.endsWith("UPDATED_BY")) && !audit.some(f=>f.path.endsWith("LAYOUT")), "audit filter failed");
      assert(layout.some(f=>f.path.endsWith("LAYOUT")) && !layout.some(f=>f.path.endsWith("UPDATED_BY")), "layout filter failed");
    });
    test("duplicate names are ambiguous, not additions or removals", () => {
      const d = diff("duplicate-names");
      assert(d.warnings.some(x=>x.code === "AMBIGUOUS_MATCH"), "no ambiguity warning");
      assert(!d.changes.some(x=>x.category === "steps" && x.name === "Start"), "ambiguous step classified");
    });
    test("broken target is reported", () => assert(parse("broken-reference").warnings.some(x=>x.code === "MISSING_STEP"), "missing warning"));
    test("conflicting endpoint is reported", () => assert(parse("conflicting-endpoint").warnings.some(x=>x.code === "ENDPOINT_MISMATCH"), "missing warning"));
    test("invalid XML rejected", () => { let threw = false; try { parse("invalid-xml"); } catch(e) { threw = true; } assert(threw, "accepted invalid XML"); });
    test("DTD rejected", () => { let threw = false; try { w.parseSif("<!DOCTYPE REPOSITORY><REPOSITORY/>"); } catch(e) { threw = true; } assert(threw, "accepted DTD"); });
    const taskXml = `<REPOSITORY><PROJECT><TASK NAME="Example">
      <TASK_BRANCH NAME="go" FROM_STEP_NAME="Start" TO_STEP_NAME="End" EXPRESSION="condition">
        <TASK_BRANCH_CRITERIA NAME="criterion" PROPERTY_NAME="P" OPERATION="EQ"/>
      </TASK_BRANCH>
      <TASK_PROPERTY NAME="P" DATA_TYPE="VARCHAR"/>
      <TASK_STEP NAME="Start" TYPE="START"><TASK_STEP_IO_ARGUMENT NAME="arg" PROPERTY_NAME="P" VALUE="old"/></TASK_STEP>
      <TASK_STEP NAME="End" TYPE="END"/>
    </TASK></PROJECT></REPOSITORY>`;
    test("task parses branches, properties and arguments independently of element order", () => {
      const t = w.parseSif(taskXml).workflows[0];
      assert(t.kind === "TASK" && t.steps.length === 2 && t.branches.length === 1 && t.props.length === 1, "task counts");
      assert(t.steps.find(s => s.attrs.NAME === "Start").branches[0].criteria[0].attrs.PROPERTY_NAME === "P", "criteria not parsed");
      assert(t.steps.find(s => s.attrs.NAME === "Start").ioArgs[0].attrs.VALUE === "old", "argument missing");
      w.renderWorkflow(t, null);
      assert(w.document.querySelectorAll(".edge").length === 1, "task edge not rendered");
    });
    test("task comparison detects changed arguments and rejects mixed types", () => {
      const a = w.parseSif(taskXml).workflows[0];
      const b = w.parseSif(taskXml.replace('VALUE="old"', 'VALUE="new"')).workflows[0];
      assert(w.diffWorkflows(a,b).changes.some(c => c.fields.some(f => f.old === "old" && f.new === "new")), "argument change missing");
      let rejected = false;
      try { w.diffWorkflows(base, a); } catch (_) { rejected = true; }
      assert(rejected, "mixed definition types accepted");
    });
    test("unresolved task source is preserved and reported", () => {
      const t = w.parseSif(taskXml.replace('FROM_STEP_NAME="Start"', 'FROM_STEP_NAME="Missing"')).workflows[0];
      assert(t.warnings.some(x => x.code === "UNRESOLVED_TASK_SOURCE"), "warning missing");
      assert(t.unknownChildrenXml.some(x => x.includes("TASK_BRANCH")), "source XML not preserved");
      assert(t.branches.length === 0, "ambiguous edge was attached");
    });
    const taskResponse = await fetch("../demo%20task%20sif.xml");
    if (taskResponse.ok) {
      const taskReference = await taskResponse.text();
      test("provided task fixture has five steps, five branches and nine properties", () => {
        const t = w.parseSif(taskReference).workflows[0];
        assert(t.attrs.NAME === "My Demo Task" && t.steps.length === 5 && t.branches.length === 5 && t.props.length === 9, "task fixture counts");
        assert(t.steps.reduce((sum, step) => sum + step.ioArgs.length, 0) === 2, "I/O count");
        assert(t.branches.find(b => b.attrs.NAME === "Y").criteria[0].attrs.PROPERTY_NAME === "Test Property", "criterion missing");
      });
    } else {
      const li = document.createElement("li");
      li.textContent = "SKIP: optional local demo task sif.xml not available";
      results.appendChild(li);
    }
    test("duplicate task source is not resolved to an arbitrary step", () => {
      const duplicate = taskXml.replace('<TASK_STEP NAME="End" TYPE="END"/>', '<TASK_STEP NAME="Start" TYPE="TASK"/><TASK_STEP NAME="End" TYPE="END"/>');
      const t = w.parseSif(duplicate).workflows[0];
      assert(t.warnings.some(x => x.code === "UNRESOLVED_TASK_SOURCE"), "ambiguous source warning missing");
      assert(t.branches.length === 0 && t.unknownChildrenXml.some(x => x.includes("TASK_BRANCH")), "ambiguous branch was not preserved");
    });
    await w.loadSingleFile(new w.File([taskXml], "task.sif"));
    test("task upload renders graph, details and argument search", () => {
      const doc = w.document;
      assert(doc.querySelectorAll(".node").length === 2 && doc.querySelectorAll(".edge").length === 1, "task graph incomplete");
      assert(doc.getElementById("metaContent").textContent.includes("TASK"), "task type not shown");
      const input = doc.getElementById("searchSingle");
      input.value = "old";
      input.dispatchEvent(new w.Event("input", {bubbles:true}));
      const match = Array.from(doc.querySelectorAll(".search-match")).find(m => m.textContent.includes("I/O argument"));
      assert(match, "task argument not searchable");
      match.click();
      assert(doc.getElementById("detailsContent").textContent.includes("old"), "task argument not displayed");
      input.value = "";
      input.dispatchEvent(new w.Event("input", {bubbles:true}));
    });
    test("X-ray shows task argument value", () => {
      const doc = w.document, toggle = doc.getElementById("btnXray");
      toggle.click();
      assert(Array.from(doc.querySelectorAll(".xray-label title")).some(t => t.textContent.includes("VALUE: old")), "task argument value missing");
      toggle.click();
    });
    w.setMode("compare");
    await w.loadCompareFile("base", new w.File([taskXml],"task-baseline.sif"));
    await w.loadCompareFile("upd", new w.File([taskXml.replace('VALUE="old"', 'VALUE="new"')],"task-updated.sif"));
    test("task comparison UI highlights the modified step and shows old/new values", () => {
      const doc = w.document;
      assert(doc.querySelector(".node.modified"), "changed task step not highlighted");
      const change = Array.from(doc.querySelectorAll(".change-card")).find(c => c.textContent.includes("Start"));
      assert(change, "task change not listed");
      change.click();
      const details = doc.getElementById("detailsContent").textContent;
      assert(details.includes("old") && details.includes("new"), "task old/new values missing");
    });
    await w.loadCompareFile("base", new w.File([baseline],"baseline.sif"));
    await w.loadCompareFile("upd", new w.File([files.functional],"functional.sif"));
    test("comparison graph marks modified node and branch", () => {
      assert(w.document.querySelectorAll(".node.modified").length >= 1, "node not highlighted");
      assert(w.document.querySelectorAll(".edge.modified").length >= 1, "branch not highlighted");
      assert(w.document.querySelector(".status-text"), "non-colour marker missing");
    });
    test("search highlights coexist with comparison status and clear", () => {
      const doc = w.document, input = doc.getElementById("searchCompare");
      input.value = "Changed expression";
      input.dispatchEvent(new w.Event("input", {bubbles:true}));
      const edge = doc.querySelector(".edge.modified");
      assert(edge && edge.previousElementSibling.classList.contains("search-halo"), "modified branch search highlight missing");
      input.value = "";
      input.dispatchEvent(new w.Event("input", {bubbles:true}));
      assert(!doc.querySelector(".search-halo") && doc.querySelector(".edge.modified"), "clearing search removed comparison status");
    });
    test("change list selection displays old and new values", () => {
      const button = w.document.querySelector(".change-card");
      assert(button, "no change cards");
      button.click();
      assert(w.document.getElementById("detailsContent").textContent.includes("Old") && w.document.getElementById("detailsContent").textContent.includes("New"), "diff details missing");
    });
    await w.loadCompareFile("upd", new w.File([files["added-removed"]],"added-removed.sif"));
    test("removed connection remains visible", () => assert(w.document.querySelector(".edge.removed"), "removed branch not visible"));
  } catch(error) {
    failed++;
    const li = document.createElement("li"); li.className = "fail"; li.textContent = "Harness error: " + error.stack; results.appendChild(li);
  }
  document.getElementById("summary").textContent = `${passed} passed, ${failed} failed`;
  document.title = `${failed ? "FAIL" : "PASS"} — ${passed} passed, ${failed} failed`;
});
</script>
</body>
</html>
